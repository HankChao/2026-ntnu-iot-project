listener 1883
allow_anonymous false
password_file /tmp/ntnu-mqtt-passwd

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Optional extra listeners (e.g. TLS on 8883) written by scripts/setup.sh tls.
# Must stay last so listener-specific options apply to those listeners.
include_dir /mosquitto/config/conf.d
